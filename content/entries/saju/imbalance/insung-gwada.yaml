  short: 인성 과다 — 생각이 실행보다 앞서는 구조, 산출 비중을 키우는 게 좋습니다.
  medium: 수용·학습·관찰이 많아 준비는 빠르게 완성되는데 마지막 발표·출시·실행이 길어지기 쉽습니다. 인성의 깊이를 식상의 표현으로 내보내는 균형점을 잡는 게 관건입니다.
