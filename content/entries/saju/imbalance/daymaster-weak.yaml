body:
  short: 기반 보강(학습·수용·휴식)을 생활 점검 항목으로 참고하며, 확장 여부는 인프라·자원·위험을 함께 확인합니다.
  medium: 비겁·인성의 축이 얇아 에너지 관리가 곧 실력입니다. 배움·수용·휴식으로 축을 채우는 루틴이 있으면, 같은 일을 해도 소모가 훨씬 적습니다.
  long: 신약한 명식은 받는 구조를 만드는 관점으로 참고할 수 있습니다. 인성(스승·자격·시스템)과 비겁(동료·파트너)의 지원 가능성을 살피고, 단독 확장·사업 여부는 자원·위험·시점과 당사자의 판단을 함께 확인합니다.
tags: [강약, 회복]
