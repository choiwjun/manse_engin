body:
  short: 굵은 오행이 인생의 주 테마를 만들고, 얇은 오행 영역은 후천적 보완 주제가 됩니다.
  medium: 분포 격차가 커서 인생의 무게가 특정 오행 영역에 실립니다. 굵은 오행을 일·정체성의 축으로 쓰고, 얇은 오행은 환경·인물·습관으로 후천적으로 채우는 전략이 맞습니다.
