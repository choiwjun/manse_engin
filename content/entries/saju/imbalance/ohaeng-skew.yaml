body:
  short: 굵은 오행이 인생의 주 테마를 만들고, 얇은 오행 영역은 후천적 보완 주제가 됩니다.
  medium: 분포 격차가 커서 인생의 무게가 특정 오행 영역에 실리는 구조로 읽힙니다. 굵은 오행과 얇은 오행이 일·환경·습관에서 어떻게 나타나는지 살피며, 보완 여부는 실제 자원과 상황을 함께 확인합니다.
