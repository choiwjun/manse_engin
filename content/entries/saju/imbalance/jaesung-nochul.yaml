body:
  short: 재물 기회가 눈에 띄는 구조로 참고하며, 분산·서면화 같은 관리 수단의 필요성은 실제 위험과 조건을 함께 확인합니다.
  medium: 천간에 재성이 드러나 재물 기회에 접근이 빠릅니다. 다만 노출된 재성은 눈에 띄는 만큼 지출·분쟁에도 열려 있으니 분산·서면화 같은 방어가 세트입니다.
