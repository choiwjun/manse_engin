body:
  short: 표현·활동 폭이 넓지만 산으로 흩어지기 쉬워, 시기별로 한 방향을 정해 몰아주는 절제가 성과를 좌우합니다.
  medium: 표현·활동·관심사가 많아 시작은 빠른 편으로 읽힙니다. 여러 일을 병행할 때 산출이 분산되는지 살피고, 시기별 우선순위와 자원 배분을 현실 조건에 맞춰 점검합니다.
