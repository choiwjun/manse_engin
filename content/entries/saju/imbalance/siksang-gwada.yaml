body:
  short: 식상 과다 — 폭은 넓지만 흩어지기 쉬워, 한 방향 모으기가 성과를 좌우합니다.
  medium: 표현·활동·관심사가 많아 시작은 빠릅니다. 다만 동시에 여러 일을 벌이면 산출이 분산되므로, 시기별로 한 축을 정해 몰아주는 절제가 필요합니다.
