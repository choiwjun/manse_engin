body:
  short: 독립심이 강한 대신 자원 분배와 협력에서 마찰이 생기기 쉬워, 역할·분배의 경계를 서면으로 정해두는 게 안전합니다.
  medium: 자아·경쟁의 축이 커서 단독으로 밀고 나가는 힘이 강합니다. 이익 분배와 역할 경계를 서면으로 미리 정해두면 관계 마찰의 대부분이 줄어듭니다.
