body:
  short: 책임과 압박의 축이 크게 읽히는 구조로, 건강·스케줄은 현실적인 생활 점검 항목으로 살펴봅니다.
  medium: 규율·책임의 축이 커서 맡은 역할이 늘어날 수 있다는 전통적 해석입니다. 체력·수면·일정과 실제 부담은 명식이 진단하지 않으므로 별도로 확인하고, 건강 우려는 의료 전문가의 판단을 우선합니다.
