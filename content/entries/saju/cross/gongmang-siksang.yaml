  short: 표현의 욕구는 분명한데 발표·공개에서 마음이 무거워 늦게 나오기도 하니, 공개 루트를 미리 정해두는 게 좋습니다.
  medium: 만들고 말하고 싶은 욕구는 분명한데 발표·공개 단계에서 마음이 무거워 늦게 나오기도 합니다. 공개 루트를 미리 정해두면 표현의 흐름이 부드러워집니다.
