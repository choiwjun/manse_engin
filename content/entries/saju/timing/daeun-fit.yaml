body:
  short: 지금 들어선 대운이 명식의 활용점을 데려온 구간입니다.
  medium: 현재 대운이 용신 오행을 따라가는 구간으로, 명식이 원래 잘하는 방향이 밖에서도 통하는 시기입니다. 이 구간의 세운은 작은 판이 아니라 대운 방향을 증폭하거나 누르는 레버로 작동합니다.
