body:
  short: 기본기 점검과 규모 축소 관리가 맞는 구간으로, 이 시기의 인내가 다음 대운의 밑천이 됩니다.
  medium: 현재 대운이 기신 방향으로 읽히는 구간입니다. 확장 여부는 운세만으로 정하지 않고 리스크·자원·기본기를 함께 점검합니다. 실제 피로와 건강 우려는 의료 전문가의 판단을 우선하며, 이 시기의 경험을 다음 국면의 참고 자료로 남깁니다.
