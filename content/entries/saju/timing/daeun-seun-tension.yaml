  short: 확장과 리스크를 함께 점검해 볼 구간으로, 큰 결정은 필요·자원·대안을 확인한 뒤 판단합니다.
  medium: 기신 대운 위에 기신 세운이 겹치는 구간으로 참고할 수 있습니다. 건강을 운세로 판단하지 않으며, 실제 생활 부담은 의료 전문가의 판단을 우선합니다. 현금흐름·계약 조건과 대안을 확인해 결정 범위를 정합니다.
