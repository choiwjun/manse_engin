  medium: 비겁의 자기 축과 추진력이 식상의 표현·생산으로 이어지는 흐름으로 참고합니다. 역량을 산출물로 전환하는 조건을 함께 살펴봅니다. 실제 성장은 실행·피드백·현실 조건을 함께 확인합니다.
