# 전문가 등급 해석 문구 — 검수 완료 (reviewed)
id: saju/flow/sangsaeng-saengjae
title: 식상생재(食傷生財)
audience: counselor
status: reviewed
sampleBirth:
  year: 1985
  month: 1
  day: 10
  hour: 16
  minute: 45
  gender: male
