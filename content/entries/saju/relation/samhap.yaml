body:
  short: 삼합 — 세 지지가 한 국으로 뭉치는 강한 결속입니다.
  medium: 감지된 세 지지가 한 오행으로 뭉쳐 그 기운이 명식의 주축이 됩니다. 결속·협업·성취에 힘이 실리는 구조이며, 합쳐진 오행이 용신이면 시너지가 더 커집니다.
