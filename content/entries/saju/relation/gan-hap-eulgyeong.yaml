  short: 乙庚 천간합 — 서로 끌리는 연결이 만들어집니다.
  medium: 부드러움과 강건함이 만나는 합으로, 사람·조직과의 연결이 잘 형성됩니다. 다만 합은 결이 바뀌는 지점이기도 하니, 유대가 편의가 아닌 방향인지 확인하며 관리하세요.
