body:
  short: 열정·산출이 많다고 읽히는 구조로, 휴식·비축과 생활 리듬을 현실적인 점검 항목으로 살펴봅니다.
  medium: 열정·산출이 많다는 전통적 해석을 참고할 수 있습니다. 실제 피로와 소진 상태를 명식으로 판단하지 않으며, 휴식·일정의 균형을 살피고 건강 우려는 의료 전문가의 판단을 우선합니다.
