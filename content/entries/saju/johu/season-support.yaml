body:
  short: 원국의 장단점이 계절의 도움으로 부드럽게 드러나는 구조로, 환경과 생활 리듬을 함께 점검해 볼 수 있습니다.
  medium: 왕한 오행이 일간을 생하는 계절 구조로 참고할 수 있습니다. 계절 지표가 스트레스나 회복 상태를 진단하는 것은 아니므로, 실제 컨디션과 생활 부담은 별도로 살피고 건강 우려는 의료 전문가와 상담합니다.
