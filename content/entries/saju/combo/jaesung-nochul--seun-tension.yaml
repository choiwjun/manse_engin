body:
  short: 재성이 천간에 드러난 명식에 세운이 기신 방향입니다. 재물이 밖으로 보이는 구조에 연운이 어긋나는 해라, 투자·대출·큰 지출은 이 해를 피하고 기존 자산의 방어에 집중하는 것이 좋습니다.
  medium: 재성이 천간에 드러난 명식에 올해 세운이 기신 방향입니다. 재물이 밖으로 보이는 구조에 연운이 어긋나는 해라, 보이는 재물이 손실이나 분쟁을 부르기 쉽습니다. 투자·대출·큰 지출·보증은 이 해를 피하고, 기존 자산의 방어와 문서 정리에 집중하는 것이 유지법입니다.
