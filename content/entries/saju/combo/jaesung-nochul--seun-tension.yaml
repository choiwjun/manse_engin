body:
  short: 재성이 천간에 드러난 명식에 세운이 기신 방향입니다. 재물이 밖으로 보이는 구조에 연운이 어긋나는 해이므로, 투자·대출·큰 지출은 평소보다 조건과 회수 가능성을 더 꼼꼼히 확인할 시기로 참고합니다.
  medium: 재성이 천간에 드러난 명식에 올해 세운이 기신 방향입니다. 재물과 연운의 관계를 전통적 해석으로 참고하되, 재정 결정은 운세로 정하지 않습니다. 지출·부채·보증은 외부 전문가와 조건·문서·회수 가능성을 확인하고, 자산 방어와 현금흐름을 함께 검토합니다.
tags: [조합, 재성, 세운, 기신]
