body:
  short: 권위와 학습의 흐름은 있으나 세운이 기신 방향입니다. 올해는 제도·조직의 단계를 밟는 데 연운이 어긋나는 구간이라, 승진·자격 도전은 내년을 노리고 실력 축적에 집중하는 것이 좋습니다.
  medium: 관인상생 구조가 있는데 올해 세운이 기신 방향인 명식입니다. 권위와 학습의 흐름은 있으나 연운이 어긋나는 해라, 승진·자격·진학 도전은 시기가 무르익지 않았습니다. 이 해에는 도전 자체보다 실력과 서류의 완성도를 높여 두고, 운이 돌아오는 해를 노리는 것이 순리입니다.
