body:
  short: 권위와 학습의 흐름은 있으나 세운이 기신 방향입니다. 올해는 제도·조직의 단계를 밟는 데 연운이 어긋나는 구간으로, 승진·자격 도전은 요건과 일정을 다시 확인하며 실력 축적을 병행하는 것이 좋습니다.
  medium: 관인상생 구조가 있는데 올해 세운이 기신 방향인 명식입니다. 권위·학습과 연운의 관계를 전통적 해석으로 참고하되, 승진·자격·진학은 요건·준비도·일정·대안을 함께 확인해 당사자가 판단합니다.
