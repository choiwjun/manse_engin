  short: 소모 관리가 최우선인 구간으로, 무리한 단독 결행은 비용이 크니 협력과 복기를 선택하세요.
  medium: 기반이 얇다고 읽히는 상태에서 기신 대운이 겹치는 구간입니다. 같은 일의 부담을 크게 느낄 수 있다는 참고 해석일 뿐 실제 상태를 진단하지 않습니다. 자원·현금흐름·관계의 조건을 점검하고, 피로와 건강 우려는 의료 전문가의 판단을 우선합니다.
