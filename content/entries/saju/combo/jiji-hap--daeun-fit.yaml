body:
  short: 지지 합이 있는데 대운이 용신 방향입니다. 묶인 결속과 시기의 관계를 살펴보는 구간으로, 협업·계약·결합은 상대의 의사와 조건을 함께 확인합니다.
  medium: 지지 합이 있는 명식에 현재 대운이 용신 방향으로 들어온 구간입니다. 묶인 결속이 시기의 도움을 받는다는 전통적 해석을 참고하되, 협업·계약·파트너십·결합은 문서·위험·이탈 조건과 당사자의 의사를 우선해 판단합니다.
