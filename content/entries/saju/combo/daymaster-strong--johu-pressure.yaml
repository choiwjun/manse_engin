body:
  short: 일간이 강한데 계절이 일간을 극합니다. 강한 힘에 계절의 제동이 걸리는 구조라, 힘이 있어도 환경이 눌러주니 무리한 확장보다 계절이 허락하는 범위 안에서 움직이는 것이 맞습니다.
  medium: 일간이 강한 명식인데 월지의 왕 기운이 일간을 극하는 구조입니다. 강한 힘에 계절의 제동이 걸리는 형태라, 힘이 있어도 환경이 눌러줍니다. 이 구조는 무리한 확장보다 계절이 허락하는 범위 안에서 움직이는 것이 맞고, 힘을 쓰기보다 방향을 다듬는 데 쓰는 것이 효율적입니다.
