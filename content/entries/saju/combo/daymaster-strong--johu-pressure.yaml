body:
  short: 일간이 강한데 계절이 일간을 극하는 구조로 읽힙니다. 환경과 자원의 제약을 함께 살피며 확장 범위를 현실 조건에 맞춰 검토합니다.
  medium: 일간이 강한 명식인데 월지의 왕 기운이 일간을 극하는 구조입니다. 강약과 계절은 전통적 참고 지표이므로 결과나 감당 능력을 단정하지 않습니다. 확장·도전은 실제 자원·일정·위험을 확인하고 방향을 조정합니다.
