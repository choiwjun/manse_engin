body:
  short: 지위·규범의 자리와 일간 강약의 관계를 살펴볼 수 있는 구조입니다. 겉으로 보이는 지위와 실질적인 역할·책임의 차이는 현실 조건과 함께 확인합니다.
  medium: 관성 자리에 공망이 걸려 있고 일간이 신약한 명식입니다. 지위·규범·명예가 허상으로 보이거나 실체 없이 흐르기 쉬운 구조입니다. 관성의 허상에 휘둘리지 않으려면, 겉으로 보이는 지위보다 실질적인 역할과 책임을 먼저 잡는 것이 이 구조의 현실적인 대응입니다.
