body:
  short: 충의 마찰이 있는데 세운이 기신 방향입니다. 마찰과 연운의 관계를 참고하되, 관계·영역의 변화는 현실 조건과 당사자의 의사를 함께 확인합니다.
  medium: 지지 충이 있는데 올해 세운이 기신 방향인 명식입니다. 마찰과 연운의 관계를 전통적 해석으로 참고하되, 이사·이직·관계 변화 같은 선택은 주거·직업·관계의 현실 조건과 당사자의 의사를 함께 확인합니다.
