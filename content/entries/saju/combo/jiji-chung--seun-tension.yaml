body:
  short: 충의 마찰이 있는데 세운이 기신 방향입니다. 올해는 마찰이 연운의 무게와 겹치는 구간이라, 관계·영역의 충돌이 표면으로 터지기 쉬우니 이사·이직·관계 단절 같은 큰 결단은 신중해야 합니다.
  medium: 지지 충이 있는데 올해 세운이 기신 방향인 명식입니다. 마찰이 연운의 무게와 겹치는 해라, 평소 잠잠하던 충의 자리가 표면으로 터지기 쉽습니다. 이사·이직·관계 단절처럼 충의 자리를 직접 흔드는 큰 결단은 이 해를 피하거나, 불가피하면 충의 주기를 보고 가장 덜 흔들리는 달을 고르는 것이 좋습니다.
tags: [조합, 충, 세운, 기신]
