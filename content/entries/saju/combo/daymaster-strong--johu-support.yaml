body:
  short: 태어난 계절이 일간을 돕는 데다 힘도 넉넉한 구조라, 이 시기의 확장은 과감하게 가져가도 무리가 적습니다.
  medium: 월지 계절이 일간을 생하고 일간이 신강한 명식입니다. 환경과 힘이 같은 방향으로 작용하는 구조라, 평소보다 큰 결정·확장·도전이 이 시기에는 버틸 만한 수준으로 들어옵니다. 다만 계절이 바뀌면 후원이 빠지므로, 이 구간의 성과를 다음 국면의 자산으로 옮겨 두는 설계가 좋습니다.
