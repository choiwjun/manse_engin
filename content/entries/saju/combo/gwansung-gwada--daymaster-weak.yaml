body:
  short: 규범·책임의 압력과 생활 부담의 관계를 살펴볼 수 있는 구조입니다. 맡은 역할과 경계는 실제 자원·상황에 맞춰 점검합니다.
  medium: 관성이 과다한데 일간이 신약한 명식입니다. 주변의 기대·규범·책임이 겹겹이 쌓여 자기 결정권이 좁아지기 쉽습니다. 역할을 하나씩 줄여 나가고, 거절 가능한 선을 미리 정해 두는 것이 이 구조를 버티는 방법입니다.
