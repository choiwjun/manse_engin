body:
  short: 지지 형이 있는데 대운이 기신 방향입니다. 규칙·약속의 마찰이 시기의 무게와 겹치는 구간이라, 계약·약속·절차의 작은 어긋남이 크게 번지기 쉬우니 문서·절차를 꼼꼼히 확인하는 것이 좋습니다.
  medium: 지지 형이 있는 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 규칙·약속·절차의 마찰이 시기의 무게와 겹치는 시기라, 계약서 조항·구두 약속·행정 절차의 작은 어긋남이 크게 번지기 쉽습니다. 문서로 확인하고 절차를 건너뛰지 않는 것이 이 구간의 방어법입니다.
