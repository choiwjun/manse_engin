body:
  short: 삼합의 결속이 있는데 대운이 기신 방향입니다. 세 자리가 한 방향으로 묶인 힘이 시기와 어긋나는 구간이라, 팀·조직·연합의 결속이 오히려 기신 쪽으로 기울기 쉬우니 묶인 판의 방향을 점검하는 것이 좋습니다.
  medium: 삼합이 있는 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 세 자리가 한 방향으로 묶인 결속이 시기와 어긋나 있어, 팀·조직·연합의 힘이 기신 쪽으로 기울기 쉽습니다. 묶인 판이 나를 끌고 가는 방향이 맞는지 점검하고, 필요하면 묶임의 조건을 재협상하는 것이 이 구간의 유지법입니다.
tags: [조합, 삼합, 대운, 기신]
