body:
  short: 엮인 관계가 어긋난 연운과 만나, 결합·인연이 묶인 채로 소모가 커지는 해입니다.
  medium: 지지에 합이 있는 명식에 세운이 기신 방향입니다. 엮인 관계가 어긋난 연운과 만나, 결합·계약·인연이 묶인 채로 소모가 커지는 해입니다. 올해는 묶인 관계 안에서 빠져나오기보다 조건·기대를 문서로 재정리하는 것이 소모를 줄입니다.
