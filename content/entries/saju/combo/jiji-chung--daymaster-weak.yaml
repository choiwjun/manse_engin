body:
  short: 충의 마찰이 있는데 일간이 약해 휘둘리기 쉬운 구조라, 충의 주기를 파악하고 미리 거리를 두는 것이 유지법입니다.
  medium: 지지 충이 있는데 일간이 신약한 명식입니다. 마찰이 일어나는 자리의 관계·영역에서 휘둘리기 쉬우므로, 충이 일어나는 주기를 파악하고 미리 거리를 두는 것이 유지법입니다. 충을 피하기보다 그 파장을 예측하고 대비하는 쪽이 이 구조의 현실적인 대응입니다.
