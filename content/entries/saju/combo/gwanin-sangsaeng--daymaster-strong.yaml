body:
  short: 권위와 학습의 흐름이 살아 있고 일간도 강한 구조라, 제도·조직·자격의 단계를 밟는 데 유리합니다.
  medium: 관성과 인성이 모두 있어 권위와 학습이 서로를 돕는 흐름이 있고, 일간도 신강한 명식입니다. 제도·조직·자격의 단계를 밟는 데 유리하니, 흐름을 타고 올라가는 것이 이 구조의 활용입니다. 흐름이 있으므로 방향을 바꾸기보다 그 안에서 속도를 높이는 것이 좋습니다.
