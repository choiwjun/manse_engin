body:
  short: 재물을 만드는 흐름은 있으나 세운이 기신 방향입니다. 올해는 재물 쪽 확장이 연운과 어긋나는 구간이라, 새 투자보다 기존 수입원의 방어와 정리가 우선입니다.
  medium: 식상생재 구조가 있는데 올해 세운이 기신 방향인 명식입니다. 재물을 만드는 흐름은 살아 있으나 연운이 어긋나는 해라, 새 투자·확장보다 기존 수입원의 방어와 정리가 우선입니다. 이 해에 무리하게 판을 키우면 흐름이 있어도 결과가 뒤집히기 쉬우니, 규모를 줄여 운영하는 것이 유지법입니다.
