body:
  short: 권위와 학습이 서로 돕는 흐름에 세운이 용신 방향입니다. 올해는 승진·자격·진학 같은 계단식 도전이 연운의 지지를 받는 구간이라, 서류·시험·심사 쪽 결정을 이 해에 두기 좋습니다.
  medium: 관인상생 구조가 있는데 올해 세운이 용신 방향인 명식입니다. 권위와 학습이 서로 돕는 흐름에 연운의 지지가 겹치는 해라, 승진·자격·진학·심사 같은 계단식 도전이 유리합니다. 서류로 평가받는 자리일수록 이 해의 운이 잘 붙으니, 준비해온 것이 있다면 이 해에 제출·응시하는 쪽이 순리입니다.
