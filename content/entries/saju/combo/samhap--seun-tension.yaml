body:
  short: 묶인 결속력이 어긋난 연운과 만나, 소속·연합 내부의 마찰이나 방향 충돌이 표면화되기 쉬운 해입니다.
  medium: 삼합 국을 이루는 명식에 세운이 기신 방향으로 들어옵니다. 세 자지가 한 국으로 묶인 결속력이 어긋난 연운과 만나, 소속·연합·팀 내부의 마찰이나 방향 충돌이 표면화되기 쉬운 해입니다. 묶인 관계 안에서 역할·기대를 다시 정하는 것이 우선입니다.
