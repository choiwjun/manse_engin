  medium: 재성 자리에 공망이 걸린 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 재물의 실체와 시기의 관계를 전통적 해석으로 참고하되, 부동산·지분·권리 관련 결정은 조건·문서·현금흐름·회수 가능성을 함께 확인합니다.
