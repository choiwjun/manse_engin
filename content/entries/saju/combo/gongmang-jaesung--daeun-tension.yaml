body:
  short: 재성 자리가 공망인데 대운이 기신 방향입니다. 재물의 실체가 비어 있는 구조에 시기까지 어긋나는 구간이라, 재물 쪽 기대를 낮추고 실물보다 현금 흐름을 먼저 잡는 것이 안전합니다.
  medium: 재성 자리에 공망이 걸린 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 재물의 실체가 비어 있는 구조에 시기까지 어긋나 있어, 부동산·지분·권리처럼 실체를 따지는 재물 결정은 이 시기에 특히 신중해야 합니다. 실물보다 현금 흐름과 회수 가능성을 먼저 확인하는 것이 방어법입니다.
tags: [조합, 공망, 재성, 대운, 기신]
