body:
  short: 오행이 결핍된 데다 일간마저 약한 구조라, 무리한 보충보다 결핍을 인정하고 최소 동작으로 버티는 것이 먼저입니다.
  medium: 오행 분포에 결핍이 있고 일간도 신약한 명식입니다. 균형도 없고 힘도 부족하니, 부족한 것을 채우려 하기보다 결핍의 영역을 인정하고 그 자리에서 최소 동작으로 버티는 것이 현실적입니다. 무리한 보충은 오히려 다른 균형을 깨뜨릴 수 있습니다.
