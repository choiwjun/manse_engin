body:
  short: 압박을 제압할 힘이 충분한 구조입니다. 식상의 제압력이 일간의 강함과 맞물려, 어려운 국면을 오히려 실력으로 돌파하는 힘이 있습니다.
  medium: 편관이 둘 이상으로 압박이 실재하는데, 식상이 그것을 제압하고 일간도 강한 명식입니다. 어려운 국면을 피하기보다 정면으로 나서서 실력으로 돌파하는 힘이 있습니다. 이 구조는 압박이 클수록 오히려 제압력이 살아나므로, 쉬운 길보다 어려운 과제를 골라야 장점이 드러납니다.
