body:
  short: 압박을 제압할 힘이 충분한 구조입니다. 식상의 제압력이 일간의 강함과 맞물려, 어려운 국면을 오히려 실력으로 돌파하는 힘이 있습니다.
  medium: 편관이 둘 이상으로 압박이 실재하는데, 식상이 그것을 제어하고 일간도 강한 명식입니다. 압박을 실력으로 다룰 가능성을 참고할 수 있으나, 어려운 국면의 대응은 안전·자원·현실 조건과 선택지를 함께 확인합니다.
