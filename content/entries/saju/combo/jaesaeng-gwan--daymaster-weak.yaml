body:
  short: 자원이 지위를 떠받치는 구조는 있으나 일간이 약해 그 흐름을 감당하기 어렵습니다. 지위를 먼저 키우기보다 기반을 먼저 다지는 것이 순서입니다.
  medium: 재성과 관성이 천간에 드러나 자원이 지위로 흐르는 구조는 있으나, 일간이 신약해 그 흐름을 감당하기 어려운 명식입니다. 지위·자격·명예를 먼저 키우기보다, 그것을 받칠 기반(체력·재정·실력)을 먼저 다지는 것이 이 구조의 현실적인 순서입니다.
