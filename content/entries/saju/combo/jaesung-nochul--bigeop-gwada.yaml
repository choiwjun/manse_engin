  short: 보이는 수입에 나눠야 할 손이 많은 구조라, 서면화와 분배 규칙이 곧 방어입니다.
  medium: 재성이 천간에 노출된 데다 비겁까지 몰려, 보이는 기회에 경쟁자·동업자가 빠르게 붙습니다. 수익 구조를 처음부터 서면으로 나눠두는 사람이 이 조합에서 현금을 지킵니다.
