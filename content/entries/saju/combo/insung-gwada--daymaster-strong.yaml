  short: 배움·지원이 과해 오히려 실행이 늦어지는 구조라, 입력보다 출력의 비율을 높이는 것이 균형입니다.
  medium: 인성이 과다하고 일간이 신강한 명식입니다. 지식·후원·안전장치가 넘쳐 오히려 움직임이 무뎌지기 쉽습니다. 새로 들이는 것보다 이미 가진 것을 꺼내 쓰는 쪽으로 비율을 바꾸면, 이 구조의 장점(깊이·준비도)이 살아납니다.
