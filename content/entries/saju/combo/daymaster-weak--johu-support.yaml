body:
  short: 일간이 약한데 계절이 일간을 생합니다. 얇은 축에 계절의 도움이 붙는 구조라, 태어난 계절이 주는 자원(환경·타이밍·지원)을 활용하면 약함을 상쇄할 수 있습니다.
  medium: 일간이 약한 명식인데 월지의 왕 기운이 일간을 생하는 구조입니다. 얇은 축에 계절의 후원이 붙는 형태라, 태어난 계절이 주는 자원 — 그 계절의 환경·타이밍·사람의 지원 — 을 활용하면 약함을 상쇄할 수 있습니다. 혼자 버티기보다 계절이 열어준 자리에서 도움을 받는 쪽이 이 구조의 활용법입니다.
tags: [조합, 신약, 조후, 계절]
