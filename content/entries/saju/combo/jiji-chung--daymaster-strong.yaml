  short: 지지 충이 있으나 일간의 기반도 함께 읽히는 구조로 참고합니다. 변화·마찰의 신호를 행동의 결론으로 단정하지 않고, 관계·주거·직업 조건과 대응 자원을 함께 확인합니다.
