body:
  short: 지지 파가 있는데 대운이 기신 방향입니다. 깨짐·파열의 마찰이 시기의 무게와 겹치는 구간이라, 관계·자리·약속이 갑자기 깨지기 쉬우니 중요한 결합은 이 시기를 피하거나 이탈 조항을 미리 정해두는 것이 좋습니다.
  medium: 지지 파가 있는 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 깨짐·파열의 마찰이 시기의 무게와 겹치는 시기라, 관계·자리·약속·물건이 갑자기 깨지거나 틀어지기 쉽습니다. 중요한 결합은 이 시기를 피하거나, 불가피하면 이탈 조항·보완책을 미리 정해두는 것이 방어법입니다.
