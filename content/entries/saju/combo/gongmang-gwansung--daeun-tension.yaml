body:
  short: 관성 자리가 공망인데 대운이 기신 방향입니다. 지위·규범의 자리가 비어 있는 구조에 시기까지 어긋나는 구간이라, 명분보다 실질 역할을 먼저 확인하고 조직의 약속은 문서로 받아두는 것이 좋습니다.
  medium: 관성 자리에 공망이 걸린 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 지위·규범의 자리가 비어 있는 구조에 시기까지 어긋나 있어, 직책·명분·조직의 약속이 실체 없이 흐르기 쉽습니다. 명분보다 실질 역할과 권한을 먼저 확인하고, 조직의 약속은 문서로 받아두는 것이 이 구간의 유지법입니다.
