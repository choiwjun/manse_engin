body:
  short: 지지 합이 있는데 대운이 기신 방향입니다. 묶인 결속이 시기와 어긋나는 구간이라, 합으로 잡힌 관계·자리가 오히려 발목을 잡기 쉬우니 묶인 것을 푸는 결정도 선택지입니다.
  medium: 지지 합이 있는 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 묶인 결속이 시기와 어긋나 있어, 합으로 잡힌 관계·자리·약속이 오히려 발목을 잡기 쉽습니다. 이 시기에는 묶인 것을 유지하기보다 조건을 재협상하거나 필요하면 푸는 결정도 선택지로 열어두는 것이 좋습니다.
