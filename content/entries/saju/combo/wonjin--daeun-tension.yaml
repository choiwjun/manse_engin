body:
  short: 원진의 속마찰이 있는데 대운이 기신 방향입니다. 겉으로 드러나지 않는 마찰이 무거운 시기에 겹치는 구간이라, 관계의 큰 결단보다 정기적 점검과 거리 조절이 중요합니다.
  medium: 원진이 있는데 현재 대운이 기신 방향인 명식입니다. 겉으로 드러나지 않는 속마찰이 무거운 시기에 겹치는 구간입니다. 관계의 큰 결단(이별·합작·고백)은 보류하고, 정기적으로 관계 상태를 점검하며 거리를 조절하는 것이 이 구간의 현실적인 대응입니다.
