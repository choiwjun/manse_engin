body:
  short: 원진의 속마찰이 있는데 대운이 기신 방향입니다. 감정과 시기의 관계를 참고하되, 관계의 정리·조정 여부는 대화·상황·당사자의 의사를 함께 확인합니다.
  medium: 원진이 있는데 현재 대운이 기신 방향인 명식입니다. 겉으로 드러나지 않는 속마찰과 시기의 관계를 전통적 해석으로 참고하되 관계의 결과를 단정하지 않습니다. 관계의 결정은 안전·상대의 의사·현실 조건을 확인해 당사자가 판단합니다.
