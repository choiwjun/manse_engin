body:
  short: 재물을 만드는 흐름이 살아 있는데 대운마저 용신 방향입니다. 흐름과 시기가 같은 방향을 가리키는 구간이라, 재물 관련 계획을 실행하기 전에 규모와 위험을 함께 점검해 볼 시기로 참고합니다.
  medium: 식상생재 구조가 있는데 현재 대운이 용신 방향인 명식입니다. 재물을 만드는 흐름과 시기의 관계를 전통적 해석으로 참고하되, 재정 결정은 운세로 정하지 않습니다. 지출·부채·계약은 자원·조건·회수 가능성과 대안을 함께 확인하고, 결과는 문서와 현실 지표로 점검합니다.
tags: [조합, 재성, 대운, 용신]
