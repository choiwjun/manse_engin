body:
  short: 권위와 학습이 서로 돕는 흐름에 대운이 용신 방향입니다. 제도·조직·자격의 단계를 밟는 데 시기까지 맞물린 구간이라, 승진·자격·진학 같은 계단식 도전이 유리합니다.
  medium: 관성과 인성이 서로를 돕는 흐름이 있는데 현재 대운이 용신 방향인 명식입니다. 제도·조직·자격의 단계를 밟는 데 흐름과 시기가 모두 맞물린 구간입니다. 승진·자격·진학·입사 같은 계단식 도전은 이 구간에서 적극적으로 가져가는 것이 좋습니다.
