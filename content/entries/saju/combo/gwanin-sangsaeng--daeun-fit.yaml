body:
  short: 권위와 학습이 서로 돕는 흐름에 대운이 용신 방향입니다. 제도·조직·자격의 단계를 밟는 흐름과 시기의 관계를 살펴보되, 승진·자격·진학은 요건과 준비도를 함께 확인합니다.
  medium: 관성과 인성이 서로를 돕는 흐름이 있고 현재 대운이 용신 방향인 명식입니다. 제도·조직·자격의 단계를 밟는 흐름이 시기와 맞물린다는 해석을 참고하되, 승진·자격·진학·입사는 일정·요건·자원을 확인해 본인의 판단으로 정합니다.
