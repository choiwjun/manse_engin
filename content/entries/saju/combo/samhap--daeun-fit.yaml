body:
  short: 삼합의 결속이 있는데 대운이 용신 방향입니다. 세 자리가 한 방향으로 묶인 힘이 시기의 도움을 받는 구간이라, 팀·조직·연합처럼 여럿이 묶이는 결정이 이 시기에 크게 작동합니다.
  medium: 삼합이 있는 명식에 현재 대운이 용신 방향으로 들어온 구간입니다. 세 자리가 한 방향으로 묶인 결속이 시기의 도움을 받는 시기라, 팀·조직·연합·컨소시엄처럼 여럿이 묶이는 결정이 크게 작동합니다. 혼자 하기보다 묶인 판을 활용하는 쪽이 이 구간의 운을 타는 방법입니다.
tags: [조합, 삼합, 대운, 용신]
