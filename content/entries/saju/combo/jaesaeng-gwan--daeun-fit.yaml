body:
  short: 재성과 관성이 천간에 드러난 흐름에 대운이 용신 방향입니다. 재물과 지위의 연결을 살펴보는 구간으로, 사업·직위·자격 선택은 현실 조건을 함께 확인합니다.
  medium: 천간에 재성과 관성이 함께 드러난 명식에 대운이 용신 방향으로 들어온 구간입니다. 재생관의 흐름이 시기와 맞물린다는 해석을 참고하되, 사업 확장·직위 상승·공식 지위 취득은 자원·요건·위험과 본인의 계획을 확인해 판단합니다.
