body:
  short: 원진의 속마찰이 있는데 세운이 용신 방향입니다. 올해는 쌓여 있던 오해·미움이 연운의 도움으로 풀리기 쉬운 해라, 오래된 관계의 감정 정리나 화해를 이 해에 시도하기 좋습니다.
  medium: 원진이 있는 명식에 올해 세운이 용신 방향입니다. 겉으로 드러나지 않던 속마찰이 연운의 도움으로 풀리기 쉬운 해라, 오래된 관계의 오해·서운함·미움을 정리하거나 화해를 시도하기 좋습니다. 원진은 자리가 정해진 마찰이므로, 그 자리의 관계에 먼저 연락하거나 정리하는 쪽이 이 해의 운을 쓰는 방법입니다.
tags: [조합, 원진, 세운, 용신]
