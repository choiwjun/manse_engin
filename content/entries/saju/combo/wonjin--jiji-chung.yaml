body:
  short: 원진과 충이 한 명식 안에 공존하는 구조라, 관계·영역의 마찰이 크고 작게 나타나는 양상으로 참고할 수 있습니다. 관계 판단은 안전·현실 조건·당사자의 의사를 우선하고 점검과 거리 조절 가능성을 살펴봅니다.
  medium: 원진(속으로 원망하는 관계)과 충(표면으로 부딪히는 관계)이 같은 명식 안에 함께 있는 구조입니다. 관계·영역의 마찰이 크게 터졌다가 작게 스며드는 식으로 반복되기 쉽습니다. 한 번에 해결하려 하기보다, 마찰이 올라오는 주기를 파악하고 거리와 속도를 조절하는 것이 이 구조의 관리법입니다.
