  medium: 식상생재 구조가 있고 올해 세운이 용신 방향인 명식입니다. 재물을 만드는 흐름이 연운의 도움을 받는다는 전통적 해석을 참고하되, 수입원 확대·투자·계약은 운세가 대신 결정하지 않습니다. 자원·위험·회수 가능성과 준비도를 확인해 판단합니다.
