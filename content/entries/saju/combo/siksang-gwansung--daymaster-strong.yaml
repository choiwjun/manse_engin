body:
  short: 식상이 관성을 제어하는 구조인데 일간이 강합니다. 규범·권위를 실력으로 다루는 힘이 있는 구조라, 조직 안에서도 자기 방식으로 결과를 내기 쉽습니다. 다만 관성을 너무 누르면 제도권의 지지를 잃을 수 있으니 적정선을 지키는 것이 좋습니다.
  medium: 식상과 관성이 함께 있고 일간이 강한 명식입니다. 식상이 관성을 제어하는 식상제관의 힘이 실리는 구조라, 규범·권위·제도를 실력으로 다루며 자기 방식으로 결과를 내기 쉽습니다. 다만 관성을 너무 누르면 제도권의 지지를 잃을 수 있으니, 실력을 쓰되 규범과의 적정 거리를 지키는 것이 이 구조의 균형입니다.
tags: [조합, 식상, 관성, 신강]
