body:
  short: 태어난 계절이 일간을 누르는 데다 힘마저 약한 구조라, 환경을 바꾸기보다 환경 안에서 버티는 전략이 먼저입니다.
  medium: 월지 계절이 일간을 극하는데 일간이 신약한 명식입니다. 시기·환경의 압력이 구조적으로 작용한다는 전통적 해석을 참고하되 실제 부담을 진단하지 않습니다. 변화 여부는 재정·관계·일정의 현실 조건과 대안을 확인해 정하고, 건강 우려는 의료 전문가의 판단을 우선합니다.
