body:
  short: 일간 강약 지표가 약한데 세운이 용신 방향입니다. 연운의 도움이 보태지는 구간으로, 올해는 평소의 계획을 점검하며 실행 범위를 조절해 볼 수 있습니다.
  medium: 일간 강약 지표가 신약으로 분류되고 올해 세운이 용신 방향인 명식입니다. 연운의 도움이 보태지는 구간으로 참고하되, 강약 지표가 의사결정을 대신하지는 않습니다. 올해의 계획·도전·확장은 자원·위험·대안을 함께 확인하고 결과는 현실 지표로 점검합니다.
