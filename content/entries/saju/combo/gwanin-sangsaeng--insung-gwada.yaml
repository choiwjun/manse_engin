body:
  short: 배움의 통로가 넓은 구조로 읽힙니다. 준비와 산출의 균형은 목표·기한·현실 조건에 맞춰 점검합니다.
  medium: 조직 성장 라인(관인상생)이 좋은데 인성이 과다해 자격·공부가 계속 추가되기 쉽습니다. 학습 마감 조건을 미리 정해두고, 배운 것을 발표·문서·제품으로 내보내는 주기를 함께 점검하면 균형을 잡는 데 도움이 됩니다.
