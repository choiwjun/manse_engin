body:
  short: 관성 자리가 공망인데 세운이 기신 방향입니다. 지위·규범의 자리가 비어 있는 구조에 연운이 어긋나는 해라, 올해는 명분·직책·조직의 약속이 실체 없이 흐르기 쉬우니 문서로 확인받는 것이 우선입니다.
  medium: 관성 자리에 공망이 걸린 명식에 올해 세운이 기신 방향입니다. 지위·규범의 자리가 비어 있는 구조에 연운이 어긋나는 해라, 직책·명분·조직의 약속이 실체 없이 흐르거나 뒤집히기 쉽습니다. 올해는 구두 약속보다 문서로 확인받고, 명분보다 실질 권한·책임을 먼저 따지는 것이 방어법입니다.
tags: [조합, 공망, 관성, 세운, 기신]
