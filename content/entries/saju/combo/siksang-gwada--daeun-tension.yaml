body:
  short: 식상이 과다한데 대운이 기신 방향입니다. 표현·생산이 과한 구조에 시기까지 어긋나는 구간이라, 말·글·산출물이 화를 부르기 쉬우니 만드는 양을 줄이고 검증 단계를 늘리는 것이 좋습니다.
  medium: 식상이 과다한 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 표현·생산·발설이 과한 구조에 시기까지 어긋나 있어, 말·글·산출물이 화를 부르기 쉽습니다. 이 시기에는 만드는 양을 줄이고 보내기 전 검증 단계를 늘리는 것이 안전하며, 특히 윗사람·조직을 향한 표현은 한 번 더 거르는 것이 좋습니다.
