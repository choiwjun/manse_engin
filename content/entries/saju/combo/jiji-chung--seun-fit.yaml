body:
  short: 충의 마찰이 있는데 세운이 용신 방향입니다. 올해는 마찰이 연운의 도움으로 오히려 정리·전환의 계기가 되는 해라, 오래 끌던 관계·영역의 문제를 이 해에 매듭짓기 좋습니다.
  medium: 지지 충이 있는 명식에 올해 세운이 용신 방향입니다. 마찰이 연운의 도움을 받아 오히려 정리·전환의 계기가 되는 해라, 오래 끌던 관계·영역·자리의 문제를 이 해에 매듭짓기 좋습니다. 충은 흔드는 힘이지만 용신운이 그 힘을 정리 쪽으로 돌려주니, 미뤄온 결단을 이 해에 실행하는 것이 순리입니다.
tags: [조합, 충, 세운, 용신]
