body:
  short: 해의 잡음이 어긋난 연운과 겹쳐, 관계·건강·일상의 방해 요소가 잔잔하게 누적되는 해입니다.
  medium: 지지에 해가 있는 명식에 세운이 기신 방향입니다. 해의 잡음이 어긋난 연운과 겹쳐, 관계·건강·일상의 방해 요소가 잔잔하게 누적되는 해입니다. 큰 사고보다 작은 불편이 반복되는 해이니, 몸과 관계의 관리 루틴을 미리 세우는 것이 좋습니다.
