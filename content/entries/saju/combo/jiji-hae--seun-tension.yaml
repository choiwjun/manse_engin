body:
  short: 해의 잡음이 어긋난 연운과 겹쳐, 관계·건강·일상의 방해 요소가 잔잔하게 누적될 수 있는 해로 참고합니다.
  medium: 지지에 해가 있는 명식에 세운이 기신 방향입니다. 해의 잡음이 어긋난 연운과 겹쳐, 관계·건강·일상의 방해 요소를 점검할 시기로 참고합니다. 큰 사고를 예측하는 문장이 아니므로 작은 불편은 생활 기록과 대화로 살피고, 건강 우려는 의료 전문가와 상담하는 것이 좋습니다.
