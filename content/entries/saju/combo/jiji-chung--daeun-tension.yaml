body:
  short: 충의 마찰이 있는데 대운이 기신 방향입니다. 마찰이 무거운 시기에 겹치는 구간이라, 관계·영역의 충돌을 피하기보다 주기를 파악하고 미리 거리를 두는 것이 유지법입니다.
  medium: 지지 충이 있는데 현재 대운이 기신 방향인 명식입니다. 마찰이 무거운 시기에 겹치는 구간이라, 관계·영역의 충돌이 크게 터지기 쉽습니다. 충이 일어나는 자리의 관계·영역을 피하기보다, 충의 주기를 파악하고 미리 거리를 두는 것이 이 구간의 유지법입니다.
