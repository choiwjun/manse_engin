  short: 충의 마찰과 대운의 기신 방향이 함께 읽히는 구간으로 참고합니다. 관계·영역의 변화와 거리 조절 여부는 안전·현실 조건·당사자의 의사를 함께 확인합니다.
  medium: 지지 충과 현재 대운의 기신 방향이 함께 읽히는 명식입니다. 관계·영역의 변화 가능성은 전통적 참고 신호로만 보고, 대응과 거리 조절 여부는 안전·현실 조건·당사자의 의사를 함께 확인합니다.
