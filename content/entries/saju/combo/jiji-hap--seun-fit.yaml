  medium: 지지에 합이 있는 명식에 세운이 용신 방향입니다. 엮인 관계가 올해의 용신 기운을 받아, 결합·계약·인연의 축이 순조롭게 묶이는 해입니다. 올해 맺는 인연·계약은 오래 가는 결속이 되기 쉬우니, 좋은 제안은 적극적으로 묶는 선택이 좋습니다.
