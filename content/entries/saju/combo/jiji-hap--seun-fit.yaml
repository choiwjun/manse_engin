body:
  short: 지지 합과 올해 세운의 관계를 살펴볼 수 있는 해로, 결합·계약·인연은 조건과 당사자의 의사를 함께 확인합니다.
  medium: 지지에 합이 있는 명식에 세운이 용신 방향입니다. 엮인 관계가 연운의 도움을 받는다는 전통적 해석을 참고하되, 인연·계약의 지속 여부를 운세로 단정하지 않습니다. 좋은 제안도 문서·위험·이탈 조건을 검토해 판단합니다.
