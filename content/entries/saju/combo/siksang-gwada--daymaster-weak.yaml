  short: 표현·생산이 과다한데 일간이 약한 구조라, 만드는 양을 줄이고 완성도를 높이는 쪽이 균형입니다.
  medium: 식상이 과다한데 일간이 신약한 명식입니다. 아이디어·표현·생산은 넘치나 감당할 힘이 부족한 구조입니다. 만드는 양을 줄이고 완성도를 높이는 쪽이 균형이며, 하나를 끝까지 밀고 나가는 것이 이 구조의 장점을 살리는 방법입니다.
