body:
  short: 인성이 과다한데 대운이 기신 방향입니다. 생각·수용이 과한 구조에 시기까지 어긋나는 구간이라, 배움이나 준비를 이유로 실행을 미루기 쉬우니 결정의 마감을 정해두는 것이 좋습니다.
  medium: 인성이 과다한 명식에 현재 대운이 기신 방향으로 들어온 구간입니다. 생각·수용·준비가 과한 구조에 시기까지 어긋나 있어, 배움이나 준비를 이유로 실행을 미루기 쉽습니다. 이 시기에는 '더 준비하고'가 아니라 '언제까지 결정할지' 마감을 먼저 정해두는 것이 구조의 함정을 피하는 방법입니다.
