body:
  short: 방향을 이룬 구조에 용신운이 더해져, 환경·소속·지역의 축이 일관된 힘으로 작동하는 구간입니다.
  medium: 계절 방합을 이루는 명식에 대운이 용신 방향입니다. 한 계절의 기운이 방향을 이룬 구조에 용신운이 더해져, 환경·소속·지역의 축이 일관된 힘으로 작동하는 구간입니다. 자리 잡은 방향을 따라 깊이 파는 선택이 이 구간의 이점을 살립니다.
