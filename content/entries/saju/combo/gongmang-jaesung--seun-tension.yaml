  medium: 재성 자리의 공망과 올해 세운의 기신 방향이 함께 읽히는 명식입니다. 약속된 금액과 실제 회수 가능성의 차이를 전통적 참고 신호로 살피되, 재정 판단은 현금흐름·계약 조건·위험을 함께 확인합니다.
