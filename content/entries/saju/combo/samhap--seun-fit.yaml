  short: 묶인 결속력이 올해의 용신 기운을 받아, 협력·연합·소속의 축이 실질 성과로 이어지는 해입니다.
  medium: 삼합 국을 이루는 명식에 세운이 용신 방향으로 들어옵니다. 세 자지가 한 국으로 묶인 결속력이 올해의 용신 기운과 만나, 협력·연합·소속의 축이 실질 성과로 이어지기 쉬운 해입니다. 함께 묶인 관계를 성과로 전환하는 설계가 좋습니다.
