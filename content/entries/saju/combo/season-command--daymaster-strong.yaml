id: saju/combo/season-command--daymaster-strong
title: 득령×신강(得令身强)
audience: counselor
status: reviewed
sampleBirth:
  year: 1940
  month: 1
  day: 7
  hour: 4
  minute: 30
  gender: male
  isLunar: false
assert:
  palja: 己丁己丙
  gyeokguk: 비견격
  yongsin: 금
body:
  short: 계절과 기반이 같은 방향으로 힘이 실린 구조로, 과잉으로 기울지 않게 나가는 출구를 확인합니다.
  medium: 태어난 계절의 왕오행이 일간과 같고 일간 축도 두텁습니다. 전통적으로는 득령득지가 겹친 강한 명식으로 읽습니다. 강한 기운이 한쪽으로 몰리지 않도록 식상(표현·생산)이나 재성(결과·실속)으로 나가는 출구가 있는지, 그 출구가 현실 조건(역할·자원·시장)과 맞는지를 함께 살펴봅니다.
  long: 이 명식은 월지의 왕오행이 일간과 같은 오행이고, 오행 계량에서도 일간 축(비겁+인성)이 강하게 잡힙니다. 고전에서는 득령득지가 겹친 신강 명식으로 읽으며, 힘이 있으니 그 힘을 어디로 보낼지가 관건입니다. 식상으로 흘려 생산·표현으로 쓰는지, 재성으로 나가 결과를 만드는지, 관성으로 받쳐 규범 안에서 쓰는지에 따라 같은 강함이 다른 모양이 됩니다. 상담에서는 강함 자체보다 강함의 출구와 그 출구의 현실 조건을 함께 봅니다.
tags: [조후, 강약, 득령, 신강]
