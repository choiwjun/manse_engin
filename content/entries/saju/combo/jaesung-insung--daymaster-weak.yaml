body:
  short: 재성과 인성이 공존하는데 일간이 약합니다. 재물을 좇으면 배움이 흔들리고, 배움에 머물면 재물이 멀어지는 구조라, 둘을 동시에 잡으려 하기보다 시기를 나눠 번갈아 가는 것이 현실적입니다.
  medium: 재성과 인성이 함께 있는데 일간이 약한 명식입니다. 재성이 인성을 극하는 재인상극의 구조로 참고할 수 있어, 재물·배움·후원의 조건이 서로 충돌하지 않는지 살핍니다. 강약 지표가 실제 건강을 진단하는 것은 아니므로, 생활 부담이나 건강 우려는 현실 조건과 의료 전문가의 판단을 우선해 조정합니다.
tags: [조합, 재성, 인성, 신약]
