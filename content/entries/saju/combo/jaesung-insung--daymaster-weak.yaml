body:
  short: 재성과 인성이 공존하는데 일간이 약합니다. 재물을 좇으면 배움이 흔들리고, 배움에 머물면 재물이 멀어지는 구조라, 둘을 동시에 잡으려 하기보다 시기를 나눠 번갈아 가는 것이 현실적입니다.
  medium: 재성과 인성이 함께 있는데 일간이 약한 명식입니다. 재성이 인성을 극하는 재인상극의 구조라, 재물을 좇으면 배움·건강·후원이 흔들리고 배움에 머물면 재물이 멀어지기 쉽습니다. 약한 몸으로 둘을 동시에 잡으려 하기보다, 시기를 나눠 재물의 해와 배움의 해를 번갈아 가는 것이 현실적입니다.
