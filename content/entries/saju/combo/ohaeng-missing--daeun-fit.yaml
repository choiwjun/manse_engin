body:
  short: 오행 분포에 결핍이 있는데 대운이 용신 방향입니다. 비어 있는 축을 용신운이 메워주는 구간이라, 평소 약했던 영역에서 기회가 열릴 수 있으니 그 축의 결정을 이 시기에 두기 좋습니다.
  medium: 오행 분포에 결핍이 있는 명식에 현재 대운이 용신 방향으로 들어온 구간입니다. 비어 있는 축을 대운이 메워주는 시기라, 평소 약했던 영역(관계·재물·지위·배움 중 결핍 오행에 해당하는 쪽)에서 기회가 열릴 수 있습니다. 그 축의 결정을 이 구간에 두면 보완 효과를 받기 쉽습니다.
tags: [조합, 오행결핍, 대운, 용신]
